<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация</title>
    <!-- Подключаем стили Bootstrap -->
    <link href="https://jsdelivr.net" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center vh-100">

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow-sm border-0 p-4">
                <div class="card-body">
                    <h2 class="card-title text-center mb-4 fw-bold text-primary">Регистрация</h2>

                    <!-- Блок для вывода ошибок из контроллера -->
                    <div th:if="${error}" class="alert alert-danger" role="alert" th:text="${error}"></div>

                    <form th:action="@{/registration}" method="post">
                        <div class="mb-3">
                            <label for="username" class="form-label">Имя пользователя</label>
                            <input type="text" class="form-control form-control-lg" id="username" name="username" placeholder="Придумайте логин" required>
                        </div>
                        <div class="mb-4">
                            <label for="password" class="form-label">Пароль</label>
                            <input type="password" class="form-control form-control-lg" id="password" name="password" placeholder="Придумайте пароль" required>
                        </div>
                        <button type="submit" class="btn btn-primary btn-lg w-100 shadow-sm mb-3">Создать аккаунт</button>
                    </form>

                    <div class="text-center">
                        <span class="text-muted">Уже есть аккаунт?</span>
                        <a th:href="@{/login}" class="text-decoration-none fw-semibold">Войти</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
